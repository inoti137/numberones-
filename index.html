<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Numberone | نامبر وان</title>
<style>:root{--b:#080808;--p:#151515;--g:#d9b66d;--t:#f7f1e5;--m:#999}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#352918,#080808 38%);color:var(--t);font-family:Tahoma,Arial;min-height:100vh}header{position:sticky;top:0;z-index:5;background:#090909f5;border-bottom:1px solid #292929;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.logo{font-weight:bold;color:var(--g);font-size:20px;white-space:nowrap}.search{display:flex;flex:1;min-width:180px}.search input{flex:1}.search select{width:100px}input,select,textarea,button{font:inherit;border-radius:11px;padding:11px;border:1px solid #333}input,select,textarea{background:#181818;color:#fff}button{background:#181818;color:#fff;cursor:pointer}.gold{background:linear-gradient(135deg,#f0d28f,#caa45b);color:#111;border:0;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{padding:60px 0}.hero h1{font-size:clamp(40px,8vw,75px);margin:10px 0}.hero em{color:var(--g);font-style:normal}.muted{color:var(--m);line-height:2}.cats,.grid{display:grid;gap:10px}.cats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.cat,.card{background:var(--p);border:1px solid #2d2d2d;border-radius:15px;padding:15px}.card{padding:0;overflow:hidden}.thumb{height:130px;display:grid;place-items:center;background:#111;color:#555;font-weight:bold}.body{padding:12px}.price{color:var(--g);font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;padding:18px;align-items:center;justify-content:center}.modal.on{display:flex}.box{width:min(500px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid #3b3b3b;border-radius:20px;padding:20px;position:relative}.box input,.box select,.box textarea,.box button{width:100%;margin:6px 0}.x{position:absolute;left:10px;top:5px;background:none;border:0;font-size:28px}.msg{padding:10px;border-radius:10px;margin:7px 0;display:none}.msg.on{display:block}.ok{background:#12301b;color:#bdebc8}.err{background:#321515;color:#ffc2c2}@media(max-width:650px){.cats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{padding:35px 0}header .logo{width:100%}}</style>
<header><div class="logo">N1 · Numberone</div><div class="search"><input id="q" placeholder="چه چیزی می‌خواهید پیدا کنید؟"><select id="sort"><option value="new">جدیدترین</option><option value="low">ارزان‌ترین</option><option value="high">گران‌ترین</option></select></div><button id="account">ورود / ثبت‌نام</button><button class="gold" id="newad">+ ثبت آگهی</button></header>
<main class="wrap"><section class="hero"><small style="color:var(--g)">بازار آنلاین نسل جدید</small><h1>خرید و فروش، <em>شیک‌تر و ساده‌تر</em></h1><p class="muted">آگهی‌های واقعی، تجربه‌ای سریع و مدرن.</p><button class="gold" id="heroAd">ثبت آگهی رایگان</button></section>
<h2>دسته‌بندی‌ها</h2><div id="cats" class="cats"></div><h2>آگهی‌های جدید</h2><div id="list" class="grid"></div></main>
<div id="auth" class="modal"><div class="box"><button class="x" data-x>×</button><h2 id="at">ورود</h2><div id="am" class="msg"></div><input id="email" type="email" placeholder="ایمیل"><input id="pass" type="password" placeholder="رمز عبور حداقل ۶ کاراکتر"><input id="name" placeholder="نام و نام خانوادگی"><button id="go" class="gold">ورود</button><button id="switch">ثبت‌نام</button><button id="resend">ارسال دوباره ایمیل تأیید</button></div></div>
<div id="ad" class="modal"><div class="box"><button class="x" data-x>×</button><h2>ثبت آگهی</h2><input id="title" placeholder="عنوان آگهی"><select id="cat"></select><input id="price" type="number" placeholder="قیمت (تومان)"><input id="city" placeholder="شهر"><textarea id="desc" placeholder="توضیحات"></textarea><button id="save" class="gold">ثبت آگهی</button><p class="muted">آگهی پس از ثبت در وضعیت بررسی قرار می‌گیرد.</p></div></div>
<div id="prof" class="modal"><div class="box"><button class="x" data-x>×</button><h2>حساب من</h2><div id="pc"></div><button id="logout">خروج</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://pifhcurmfruetvmekqse.supabase.co","sb_publishable_m5ar3ap3WYzuMPX1bAH84w_mFVWr_md"),$=x=>document.getElementById(x);let user=null,cats=[],cid=null,signup=false;
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const money=x=>new Intl.NumberFormat("fa-IR").format(x||0);const open=x=>$(x).classList.add("on"),close=x=>$(x).classList.remove("on");
function msg(t,ok=false){$("am").textContent=t;$("am").className="msg on "+(ok?"ok":"err")}
async function bootstrap(){if(!user)return;await db.rpc("bootstrap_first_admin");let p=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(!p.data)await db.from("profiles").insert({id:user.id,full_name:user.user_metadata?.full_name||"کاربر Numberone",is_admin:false})}
async function init(){let s=await db.auth.getSession();user=s.data.session?.user||null;if(user)await bootstrap();$("account").textContent=user?"حساب من":"ورود / ثبت‌نام";let r=await db.from("categories").select("*").order("sort_order");cats=r.data||[];$("cats").innerHTML=cats.map(c=>`<button class="cat" data-c="${c.id}">${esc(c.icon||"●")} ${esc(c.name)}</button>`).join("");$("cat").innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");document.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{cid=x.dataset.c;ads()});await ads();db.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user)await bootstrap();$("account").textContent=user?"حساب من":"ورود / ثبت‌نام"})}
async function ads(){let q=db.from("listings").select("*").eq("status","published").limit(50);if(cid)q=q.eq("category_id",cid);let s=$("q").value.trim();if(s)q=q.or(`title.ilike.%${s}%,description.ilike.%${s}%`);let o=$("sort").value;q=q.order(o=="low"?"price":o=="high"?"price":"created_at",{ascending:o=="low"});let r=await q;if(r.error){$("list").innerHTML="<p>"+esc(r.error.message)+"</p>";return}$("list").innerHTML=r.data?.length?r.data.map(x=>`<article class="card"><div class="thumb">NUMBERONE</div><div class="body"><b>${esc(x.title)}</b><p class="price">${money(x.price)} تومان</p><small class="muted">${esc(x.city||"بدون شهر")}</small></div></article>`).join(""):'<p class="muted">هنوز آگهی منتشرشده‌ای وجود ندارد.</p>'}
function sync(){ $("at").textContent=signup?"ثبت‌نام در Numberone":"ورود به Numberone";$("go").textContent=signup?"ثبت‌نام":"ورود";$("name").style.display=signup?"block":"none";$("resend").style.display=signup?"block":"none";$("am").className="msg"}
async function auth(){let e=$("email").value.trim().toLowerCase(),p=$("pass").value,n=$("name").value.trim();if(!e||p.length<6)return msg("ایمیل معتبر و رمز حداقل ۶ کاراکتر وارد کن.");let r=signup?await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}}):await db.auth.signInWithPassword({email:e,password:p});if(r.error)return msg(r.error.message);if(signup&&!r.data.session)return msg("حساب ساخته شد؛ ایمیل تأیید را بررسی کن.",true);close("auth");location.reload()}
$("go").onclick=auth;$("switch").onclick=()=>{signup=!signup;sync()};$("resend").onclick=async()=>{let r=await db.auth.resend({type:"signup",email:$("email").value.trim()});msg(r.error?r.error.message:"ایمیل تأیید دوباره ارسال شد.",!r.error)};
$("account").onclick=async()=>{if(!user)return open("auth");let p=await db.from("profiles").select("*").eq("id",user.id).single();$("pc").innerHTML=`<p>${esc(p.data?.full_name||"کاربر")}</p><p class="muted">${esc(user.email)}</p>${p.data?.is_admin?'<button class="gold" id="admin">پنل مدیریت</button>':""}`;if(p.data?.is_admin)setTimeout(()=>$("admin").onclick=()=>location.href=location.pathname+"/admin",0);open("prof")};
$("newad").onclick=$("heroAd").onclick=()=>user?open("ad"):open("auth");$("save").onclick=async()=>{if(!user)return;let r=await db.from("listings").insert({seller_id:user.id,category_id:$("cat").value,title:$("title").value.trim(),price:Number($("price").value||0),city:$("city").value.trim(),description:$("desc").value.trim(),status:"pending"});if(r.error)alert(r.error.message);else{close("ad");alert("آگهی برای بررسی ارسال شد")}};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("q").oninput=ads;$("sort").onchange=ads;document.querySelectorAll("[data-x]").forEach(x=>x.onclick=()=>close(x.closest(".modal").id));sync();init();
</script>
