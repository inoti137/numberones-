<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numberone | مدیریت</title><style>body{margin:0;background:#090909;color:#eee;font-family:Tahoma;padding:20px}.wrap{max-width:1100px;margin:auto}.g{color:#d9b66d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.p{background:#151515;border:1px solid #333;border-radius:15px;padding:15px;margin:10px 0}button{padding:10px;border-radius:10px;border:1px solid #444;background:#1b1b1b;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #333;text-align:right}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}</style><div class="wrap"><h1 class="g">NUMBERONE · پنل مدیریت</h1><div id="msg" class="p">در حال بررسی دسترسی...</div><section id="app" style="display:none"><div class="grid"><div class="p">در انتظار<br><b id="a">0</b></div><div class="p">منتشرشده<br><b id="b">0</b></div><div class="p">کاربران<br><b id="c">0</b></div><div class="p">گزارش‌ها<br><b id="d">0</b></div></div><div class="p"><button onclick="load('pending')">در انتظار</button> <button onclick="load('published')">منتشرشده</button> <button onclick="users()">کاربران</button><div id="out"></div></div><button onclick="location.href='index.html'">بازگشت</button> <button onclick="db.auth.signOut().then(()=>location.reload())">خروج</button></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://pifhcurmfruetvmekqse.supabase.co","sb_publishable_m5ar3ap3WYzuMPX1bAH84w_mFVWr_md"),$=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));async function init(){let s=await db.auth.getSession(),u=s.data.session?.user;if(!u)return;let p=await db.from("profiles").select("is_admin").eq("id",u.id).single();if(!p.data?.is_admin)return;$("msg").style.display="none";$("app").style.display="block";let [a,b,c,d]=await Promise.all(["pending","published"].map(x=>db.from("listings").select("*",{count:"exact",head:true}).eq("status",x)).concat([db.from("profiles").select("*",{count:"exact",head:true}),db.from("reports").select("*",{count:"exact",head:true})]));$("a").textContent=a.count||0;$("b").textContent=b.count||0;$("c").textContent=c.count||0;$("d").textContent=d.count||0);load("pending")}async function load(s){let r=await db.from("listings").select("id,title,price,city,status,created_at").eq("status",s).order("created_at",{ascending:false}).limit(100);$("out").innerHTML="<h3>"+s+"</h3><table><tr><th>عنوان</th><th>قیمت</th><th>شهر</th><th>عملیات</th></tr>"+(r.data||[]).map(x=>`<tr><td>${esc(x.title)}</td><td>${x.price||0}</td><td>${esc(x.city)}</td><td>${s=="pending"?`<button onclick="set('${x.id}','published')">تأیید</button> <button onclick="set('${x.id}','rejected')">رد</button>`:`<button onclick="set('${x.id}','sold')">فروخته شد</button>`}</td></tr>`).join("")+"</table>"}async function set(id,status){await db.from("listings").update({status}).eq("id",id);location.reload()}async function users(){let r=await db.from("profiles").select("full_name,phone,city,is_admin,created_at").order("created_at",{ascending:false});$("out").innerHTML="<h3>کاربران</h3><table><tr><th>نام</th><th>شهر</th><th>مدیر</th></tr>"+(r.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.city)}</td><td>${x.is_admin?"بله":"خیر"}</td></tr>`).join("")+"</table>"}init()</script>
